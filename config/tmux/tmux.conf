set-environment -g TZ "Asia/Singapore"
bind-key -n M-a detach-client
set -g mouse on
set -g base-index 1
set -g mode-keys vi

# === TUI 兼容性优化（Claude Code 等程序）===
# 告诉 tmux 我们在 256 色 + true color 终端
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*256col*:Tc"

# 窗口大小自动匹配当前看它的客户端，避免多客户端下的 resize 乱象
set -g aggressive-resize on

# 滚动历史放大一些
set -g history-limit 50000

# 滚轮进 copy-mode 查看历史，滚回底部时自动退出（-e 选项）
# 这样既能上下看历史，又不用按 Esc
bind-key -T root WheelUpPane \
  if -F -t = "#{pane_in_mode}" \
    "send-keys -M" \
    "copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane send-keys -M

# 前缀键改为 Option(Alt) + b
set -g prefix M-c
unbind C-b
bind-key M-c send-prefix

# Option(Alt) + ` 选择并切换 session
bind-key -n M-` choose-tree -s

# Option(Alt) + ] 直接粘贴最近复制的内容
bind-key -n M-] paste-buffer

# Option+c 然后 ' 上下拆分
bind-key "'" split-window -v

# Option+c 然后 5 左右拆分
bind-key 5 split-window -h

# Option+c 然后 1 将当前面板置于新窗口
bind-key 1 break-pane

# Option+c 然后 7 关闭当前窗口
bind-key 7 confirm-before -p "kill-window #W? (y/n)" kill-window

# Option+c 然后 h/j/k/l 调整面板分隔线（-r 表示可重复按）
# 切换面板用方向键: Option+c ←↑↓→
bind-key -r h resize-pane -L 5
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r l resize-pane -R 5

# 鼠标拖选松开后：复制 + 取消高亮，但保持当前位置（不跳回底部）
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# === 状态栏样式 ===
# 整体背景：透明（跟随终端底色）
set -g status-style "bg=default,fg=colour245"
set -g status-left ""
set -g status-right "#[fg=colour255,bg=colour39] #{b:pane_current_path} #[bg=default]"
set -g status-right-length 60

# 窗口槽位：当前窗口亮蓝色高亮，非当前暗灰
set -g window-status-format "#[fg=colour250,bg=colour237] #I:#W #[bg=default]"
set -g window-status-current-format "#[fg=colour255,bg=colour39,bold] #I:#W #[bg=default]"
set -g window-status-separator " "

# Option(Alt) + 数字 切换窗口
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
